name: Auto Sitemap

on:
  push:
    branches: [main]
    paths:
      - "**.html"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: auto-sitemap
  cancel-in-progress: false

jobs:
  sitemap:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the site
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Regenerate sitemap.xml
        run: python3 generate_sitemap.py

      - name: Commit the sitemap if it changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- sitemap.xml; then
            echo "Sitemap already up to date - nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml
          git commit -m "Auto-update sitemap.xml"
          git push
          gh api --method POST "/repos/${{ github.repository }}/pages/builds" || true
